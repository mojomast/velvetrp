name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Test contracts
        if: ${{ !cancelled() }}
        run: npm run test --workspace @velvet/contracts
      - name: Test server
        if: ${{ !cancelled() }}
        run: npm --workspace velvet-mvp-server run test
      - name: Test client
        if: ${{ !cancelled() }}
        run: npm --workspace velvet-mvp-client run test
      - name: Test e2e
        if: ${{ !cancelled() }}
        run: npm run test:e2e
