name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - run: npm run typecheck
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Smoke production server
        if: ${{ !cancelled() }}
        run: npm --workspace velvet-mvp-server run build && npm --workspace velvet-mvp-server run smoke:dist
      - name: Test build scripts
        if: ${{ !cancelled() }}
        run: node --test scripts/test/run-all-tests.test.mjs scripts/test/release-stage.test.mjs server/scripts/test/build-assets.test.mjs
      - name: Test contracts
        if: ${{ !cancelled() }}
        run: npm run test --workspace @velvet/contracts
      - name: Test server
        if: ${{ !cancelled() }}
        run: npm --workspace velvet-mvp-server run test
      - name: Test client
        if: ${{ !cancelled() }}
        run: npm --workspace velvet-mvp-client run test
      - name: Test e2e
        if: ${{ !cancelled() }}
        run: npm run test:e2e
      # Keep Playwright's retained traces and page snapshots (fake provider and fixture data only)
      # so an intermittent e2e failure can be diagnosed from the run instead of guessed at.
      - name: Upload e2e failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
